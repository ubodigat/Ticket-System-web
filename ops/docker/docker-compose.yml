name: ticket-system

# Bounded diagnostics; database audit retention is configured separately.
x-diagnostics: &diagnostics
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

networks:
  internal:
    driver: bridge
    internal: true
  # Security-Audit R-1: festes Subnetz, damit die App per TRUSTED_PROXY_CIDR genau diesem
  # Netz (und damit nur Caddy als direktem Gegenüber) vertrauen kann, statt entweder gar
  # keinem Proxy oder (die ursprüngliche, fehlerhafte Annahme) "einer Hop-Zahl".
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.250.0/24}
  office:
    driver: bridge
    internal: true
  # Security-Audit R-24: nur Caddy <-> ONLYOFFICE; Caddy ist nicht mehr im "office"-Netz
  # (dort liegen App und Gotenberg).
  office-edge:
    driver: bridge
    internal: true
  # Security-Audit B7 (Virenscan): app<->clamav, isoliert wie "office".
  clamav:
    driver: bridge
    internal: true
  # Eigenes, NICHT isoliertes Netz nur für ClamAV (freshclam braucht Internetzugang für
  # Signatur-Updates) -- getrennt von allen anderen Netzen gehalten.
  clamav-egress:
    driver: bridge

volumes:
  mariadb-data:
  caddy-data:
  caddy-config:
  clamav-data:

services:
  mariadb:
    logging: *diagnostics
    image: mariadb:12.3@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
    restart: unless-stopped
    networks: [internal]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../tls/mariadb:/etc/mysql/tls:ro
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ../secrets/mariadb-encryption:/etc/mysql/encryption:ro
    # Haertung (Review 11/2026, Punkt 8): nur die Rechte, die der Einstiegspunkt zum Wechsel auf den
    # Benutzer "mysql" und zum Anlegen des Datenverzeichnisses braucht.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    logging: *diagnostics
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.server
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_BUILT_AT: ${APP_BUILT_AT:-unknown}
    restart: unless-stopped
    # "clamav" ist immer in der Netzliste, auch wenn der Dienst selbst ohne das Profil
    # "antivirus" (install.sh --enable-antivirus) nie gestartet wird -- harmlos, das Netz
    # existiert dann einfach ohne Teilnehmer auf der anderen Seite.
    networks: [internal, edge, office, clamav]
    depends_on:
      mariadb:
        condition: service_healthy
      office:
        condition: service_started
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      # Security-Audit N9: der lang laufende App-Container bekommt absichtlich NICHT mehr
      # DB_USER/DB_PASSWORD (volle DDL-Rechte) -- nur noch das eingeschraenkte Laufzeit-Konto.
      # Der Schema-Abgleich (dist/cli/schema.js) laeuft separat ueber "docker compose run" mit
      # DB_USER/DB_PASSWORD per stdin (siehe install.sh/ops/host-updater), nie in dieser Umgebung.
      DB_RUNTIME_USER: ${DB_RUNTIME_USER}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD}
      DB_SSL_CA_PATH: /run/secrets/mariadb-ca.pem
      DB_SSL_REJECT_UNAUTHORIZED: "true"
      KEK_FILE_PATH: /run/secrets/app.kek
      COOKIE_SECRET: ${COOKIE_SECRET}
      INSTALLATION_ID: ${INSTALLATION_ID}
      # Security-Audit R-1: CIDR statt Hop-Zahl (siehe app.ts) -- das feste Subnetz des
      # "edge"-Netzes oben, in dem nur Caddy laeuft.
      TRUSTED_PROXY_CIDR: ${EDGE_SUBNET:-172.30.250.0/24}
      OFFICE_PREVIEW_URL: http://office:3000
      WEBAUTHN_ORIGIN: ${PUBLIC_URL:-}
      # Feste Basis-URL fuer den Outlook-OAuth-Callback (Security-Audit R-21, outlookPersonal.ts).
      PUBLIC_BASE_URL: ${PUBLIC_URL:-}
      ONLYOFFICE_ENABLED: ${ONLYOFFICE_ENABLED:-false}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      # Security-Audit R-24: eigene Office-Subdomain (leer = Office-Ansicht aus).
      ONLYOFFICE_PUBLIC_URL: ${OFFICE_PUBLIC_URL:-}
      # Security-Audit N-3: Updates ueber den Host-Dienst ops/host-updater, kein Docker-Socket.
      UPDATE_BRIDGE_DIR: /run/update-bridge
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Security-Audit B7 (Virenscan): leer = Scan deaktiviert (Rueckwaertskompatibilitaet /
      # Installationen ohne das optionale "antivirus"-Profil, siehe install.sh --enable-antivirus).
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    volumes:
      - ../secrets/app.kek:/run/secrets/app.kek:ro
      - ../tls/mariadb/ca.pem:/run/secrets/mariadb-ca.pem:ro
      # Austauschverzeichnis zum Host-Updater (von install.sh angelegt): Anfragen schreiben, Status nur lesen.
      - ${UPDATE_BRIDGE_HOST_DIR:-/var/lib/ticket-system-update}/requests:/run/update-bridge/requests
      - ${UPDATE_BRIDGE_HOST_DIR:-/var/lib/ticket-system-update}/state:/run/update-bridge/state:ro
    # Haertung (Review 11/2026, Punkt 8): keine Linux-Capabilities, kein Rechtegewinn, Dateisystem
    # nur lesbar (die App schreibt nichts ausser nach /tmp), begrenzte Ressourcen.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Security-Audit B7 (Virenscan): optional, per Profil (install.sh --enable-antivirus) --
  # Signatur-Datenbank braucht beim ersten Start mehrere Minuten + Internetzugang (freshclam) und
  # laufend ca. 1-2GB RAM, daher nicht standardmaessig aktiv.
  clamav:
    image: clamav/clamav-debian:1.4@sha256:c7df83a4c9794aeb43b7cff296fc9f42a0f47cbf0e96704510e7e5b57b2f4913
    logging: *diagnostics
    restart: unless-stopped
    profiles: ["antivirus"]
    networks: [clamav, clamav-egress]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
    volumes:
      - clamav-data:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  office:
    image: gotenberg/gotenberg:8.38.1@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b
    logging: *diagnostics
    restart: unless-stopped
    networks: [office]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    environment:
      CHROMIUM_DISABLE_ROUTES: "true"
      PDFENGINES_DISABLE_ROUTES: "true"
      API_DISABLE_DOWNLOAD_FROM: "true"
      API_BODY_LIMIT: 20MB
      API_TIMEOUT: 40s
      LIBREOFFICE_DENY_LIST: ".*"
      WEBHOOK_DENY_LIST: ".*"
      LIBREOFFICE_MAX_QUEUE_SIZE: "2"

  # Optional native Office UI; isolated from the Internet and Docker socket.
  documentserver:
    image: onlyoffice/documentserver:10.0.0.1@sha256:ca17889f10b11141cc6441836aebdd2835cf3e1b49681b2fd6e155c94b7850b3
    logging: *diagnostics
    profiles: ["office-viewer"]
    restart: unless-stopped
    networks: [office, office-edge]
    mem_limit: 4g
    cpus: 2
    shm_size: 1g
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      JWT_HEADER: Authorization
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
      WOPI_ENABLED: "false"
      USE_UNAUTHORIZED_STORAGE: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    logging: *diagnostics
    restart: unless-stopped
    networks: [edge, office-edge]
    depends_on: [app]
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      TLS_POLICY: ${TLS_POLICY:-internal}
      OFFICE_DOMAIN: ${OFFICE_DOMAIN:-}
    # Haertung (Review 11/2026, Punkt 8): nur das Binden der Ports 80/443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 512m
    cpus: 1
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
