name: ticket-system

networks:
  internal:
    driver: bridge
    internal: true
  # Security-Audit R-1: festes Subnetz, damit die App per TRUSTED_PROXY_CIDR genau diesem
  # Netz (und damit nur Caddy als direktem Gegenüber) vertrauen kann, statt entweder gar
  # keinem Proxy oder (die ursprüngliche, fehlerhafte Annahme) "einer Hop-Zahl".
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.250.0/24}
  office:
    driver: bridge
    internal: true
  # Eigenes, NICHT isoliertes Netz nur für den Updater (git fetch gegen GitHub braucht
  # Internetzugang, "internal: true" bei "internal" würde das komplett blockieren). Getrennt
  # von "edge" gehalten, damit der Updater nicht von Caddy aus erreichbar wird.
  egress:
    driver: bridge
  # Security-Audit B7 (Virenscan): app<->clamav, isoliert wie "office".
  clamav:
    driver: bridge
    internal: true
  # Eigenes, NICHT isoliertes Netz nur für ClamAV (freshclam braucht Internetzugang für
  # Signatur-Updates) -- getrennt von "egress"/dem Updater gehalten, gleiche Begründung wie oben.
  clamav-egress:
    driver: bridge

volumes:
  mariadb-data:
  caddy-data:
  caddy-config:
  clamav-data:

services:
  mariadb:
    image: mariadb:12.3@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
    restart: unless-stopped
    networks: [internal]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../tls/mariadb:/etc/mysql/tls:ro
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.server
    restart: unless-stopped
    # "clamav" ist immer in der Netzliste, auch wenn der Dienst selbst ohne das Profil
    # "antivirus" (install.sh --enable-antivirus) nie gestartet wird -- harmlos, das Netz
    # existiert dann einfach ohne Teilnehmer auf der anderen Seite.
    networks: [internal, edge, office, clamav]
    depends_on:
      mariadb:
        condition: service_healthy
      office:
        condition: service_started
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      # Security-Audit N9: der lang laufende App-Container bekommt absichtlich NICHT mehr
      # DB_USER/DB_PASSWORD (volle DDL-Rechte) -- nur noch das eingeschraenkte Laufzeit-Konto.
      # Migrationen laufen separat ueber "docker compose run" mit DB_USER/DB_PASSWORD per -e-Flag
      # injiziert (siehe install.sh/updater-server.mjs), nie als Teil dieser staendigen Umgebung.
      DB_RUNTIME_USER: ${DB_RUNTIME_USER}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD}
      DB_SSL_CA_PATH: /run/secrets/mariadb-ca.pem
      DB_SSL_REJECT_UNAUTHORIZED: "true"
      KEK_FILE_PATH: /run/secrets/app.kek
      COOKIE_SECRET: ${COOKIE_SECRET}
      INSTALLATION_ID: ${INSTALLATION_ID}
      # Security-Audit R-1: CIDR statt Hop-Zahl (siehe app.ts) -- das feste Subnetz des
      # "edge"-Netzes oben, in dem nur Caddy laeuft.
      TRUSTED_PROXY_CIDR: ${EDGE_SUBNET:-172.30.250.0/24}
      OFFICE_PREVIEW_URL: http://office:3000
      UPDATE_SERVICE_URL: ${UPDATE_SERVICE_URL:-}
      UPDATE_TOKEN: ${UPDATE_TOKEN:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Security-Audit B7 (Virenscan): leer = Scan deaktiviert (Rueckwaertskompatibilitaet /
      # Installationen ohne das optionale "antivirus"-Profil, siehe install.sh --enable-antivirus).
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    volumes:
      - ../secrets/app.kek:/run/secrets/app.kek:ro
      - ../tls/mariadb/ca.pem:/run/secrets/mariadb-ca.pem:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Security-Audit B7 (Virenscan): optional, per Profil (install.sh --enable-antivirus) --
  # Signatur-Datenbank braucht beim ersten Start mehrere Minuten + Internetzugang (freshclam) und
  # laufend ca. 1-2GB RAM, daher nicht standardmaessig aktiv.
  clamav:
    image: clamav/clamav-debian:1.4@sha256:c7df83a4c9794aeb43b7cff296fc9f42a0f47cbf0e96704510e7e5b57b2f4913
    restart: unless-stopped
    profiles: ["antivirus"]
    networks: [clamav, clamav-egress]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  office:
    image: gotenberg/gotenberg:8.38.1@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b
    restart: unless-stopped
    networks: [office]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    environment:
      CHROMIUM_DISABLE_ROUTES: "true"
      PDFENGINES_DISABLE_ROUTES: "true"
      API_DISABLE_DOWNLOAD_FROM: "true"
      API_BODY_LIMIT: 20MB
      API_TIMEOUT: 40s
      LIBREOFFICE_DENY_LIST: ".*"
      WEBHOOK_DENY_LIST: ".*"
      LIBREOFFICE_MAX_QUEUE_SIZE: "2"

  updater:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.updater
    restart: unless-stopped
    profiles: ["dangerous-updater"]
    # internal: damit "app" den Updater unter dem Namen "updater" erreicht.
    # egress: damit "git fetch origin" GitHub erreichen kann (siehe Netz-Definition oben).
    networks: [internal, egress]
    environment:
      PORT: "3099"
      REPO_DIR: ${UPDATE_REPO_DIR:-/opt/ticket-system}
      UPDATE_BRANCH: main
      UPDATE_TOKEN: ${UPDATE_TOKEN}
      # Security-Audit N9: nur fuer die kurzlebigen "docker compose run ... migrate.js"-Aufrufe
      # nach einem Update (siehe updater-server.mjs) -- der laufende App-Container selbst bekommt
      # diese Zugangsdaten nicht mehr. Der Updater hat ueber den gemounteten Docker-Socket ohnehin
      # bereits vollen Host-Zugriff, das ist hier keine zusaetzliche Rechteausweitung.
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      UPDATE_ALLOW_MAIN_DEPLOY: ${UPDATE_ALLOW_MAIN_DEPLOY:-false}
      # Signature verification cannot be disabled; keys are explicitly operator-installed.
      UPDATE_REQUIRE_SIGNED_COMMITS: "true"
      GNUPGHOME: /run/update-keys
    volumes:
      - ${UPDATE_REPO_DIR:-/opt/ticket-system}:${UPDATE_REPO_DIR:-/opt/ticket-system}
      - /var/run/docker.sock:/var/run/docker.sock
      - ./update-keys:/run/update-keys:ro
      # Security-Audit N3: UPDATE_REQUIRE_SIGNED_COMMITS=true verlangt zusaetzlich einen
      # importierten GPG-Keyring -- da ein fest einprogrammierter Mount eines nicht vorhandenen
      # Pfads den Container-Start fuer alle anderen (Standard-)Installationen zum Scheitern
      # bringen wuerde, wird dieser Mount NICHT hier, sondern ueber eine lokale
      # docker-compose.override.yml ergaenzt (z.B. "- /pfad/zum/keyring:/home/node/.gnupg:ro"),
      # siehe CHANGES.md.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3099/health',{headers:{authorization:'Bearer '+process.env.UPDATE_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    networks: [edge]
    depends_on: [app]
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      TLS_POLICY: ${TLS_POLICY:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
