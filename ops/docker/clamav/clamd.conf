# Shared with the application's 500 MiB upload ceiling. Limits fail closed.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
TCPSocket 3310
TCPAddr 0.0.0.0
StreamMaxLength 500M
MaxFileSize 500M
MaxScanSize 1024M
MaxScanTime 300000
MaxRecursion 16
MaxFiles 10000
MaxThreads 1
MaxQueue 2
AlertExceedsMax yes
