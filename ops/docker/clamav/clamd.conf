# Matches the highest upload limit a superadmin can configure (2000 MB, apps/server/src/domain/uploadLimits.ts). Limits fail closed.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
TCPSocket 3310
TCPAddr 0.0.0.0
StreamMaxLength 2000M
MaxFileSize 2000M
MaxScanSize 2000M
MaxScanTime 300000
MaxRecursion 16
MaxFiles 10000
MaxThreads 1
MaxQueue 2
AlertExceedsMax yes
