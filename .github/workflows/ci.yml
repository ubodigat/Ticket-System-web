name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    # Review 11/2026, Punkt 5: zusaetzlich mit Europe/Berlin fuer MariaDB UND Node -- Zeitstempel muessen
    # unabhaengig von der Server-Zeitzone stimmen.
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Europe/Berlin]
    name: server (TZ=${{ matrix.tz }})
    env:
      TZ: ${{ matrix.tz }}
    services:
      mariadb:
        image: mariadb:12.3@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
        env:
          TZ: ${{ matrix.tz }}
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: ticketsystem_security_ci
          MARIADB_USER: ticketapp
          MARIADB_PASSWORD: ci-password-with-equals==
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Security-Audit R-22: muss die Node-Version aus den Produktions-Images spiegeln
          # (ops/docker/Dockerfile.server) -- sonst wird eine Laufzeit
          # ausgeliefert, auf der nie ein Test lief (TLS-/Crypto-/fetch-Verhalten kann sich bei
          # Major-Versionen aendern, ohne dass ein Test es bemerkt).
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Verify pinned installation manifest
        run: node ops/create-install-manifest.mjs --check

      - name: Installer security regressions
        run: bash ops/tests/installer-security.sh

      - name: Web TLS and LAN domain regressions
        run: bash ops/tests/web-tls.sh

      - name: Signed release regressions (release tags, foreign keys, release assets)
        run: bash ops/tests/release-signature.sh

      - name: Online updates toggle (one command on/off, fingerprint check)
        run: bash ops/tests/online-updates.sh

      - name: Backup and restore regressions (asymmetric backups, recovery kit)
        run: bash ops/tests/backup-roundtrip.sh

      - name: Typecheck
        run: npm run typecheck --workspace=apps/server

      - name: Unit tests
        run: npm run test --workspace=apps/server

      - name: Build
        run: npm run build --workspace=apps/server

      # Der CI-Dienstcontainer startet, bevor das Repo ausgecheckt ist -- die produktive
      # Konfiguration ops/docker/mariadb/conf.d/max-allowed-packet.cnf kann hier also nicht per
      # Volume gemountet werden. Stattdessen denselben Wert zur Laufzeit per SET GLOBAL setzen
      # (wirkt ab der naechsten neuen Verbindung, die der folgende Testlauf oeffnet).
      - name: Match production max_allowed_packet for the chunked-upload integration test
        run: mysql -h127.0.0.1 -uroot -pci-root-password -e "SET GLOBAL max_allowed_packet = 134217728;"

      - name: MariaDB schema sync, upgrade, key rotation and time zone integration
        run: node ops/tests/mariadb-security.mjs
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_NAME: ticketsystem_security_ci
          DB_USER: ticketapp
          DB_PASSWORD: ci-password-with-equals==
          COOKIE_SECRET: ci-cookie-secret-32-characters-minimum
          INSTALLATION_ID: 33333333-3333-4333-8333-333333333333

      - name: MariaDB encryption at rest and container hardening
        if: matrix.tz == 'UTC'
        run: bash ops/tests/mariadb-encryption-at-rest.sh

      - name: Dependency audit (keine bekannten Schwachstellen, docs/THREAT_MODEL.md §7)
        run: npm audit --audit-level=high

      # Security-Audit R-10/R-17: npm audit meldete CVE-2026-15144 (@fastify/rate-limit) nicht,
      # obwohl die Luecke in OSV/NVD gefuehrt wurde -- npm audit allein reicht als Nachweis nicht.
      # Auf einen Commit-Hash fixiert (v2.7.0), nicht auf einen beweglichen Tag.
      - name: OSV-Scan (findet auch Advisories, die npm audit nicht meldet)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36
        with:
          scan-args: --lockfile=package-lock.json
