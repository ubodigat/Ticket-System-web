name: Dependabot-Manifest-Fix anwenden

# Teil 2 von 2 (Teil 1: dependabot-manifest.yml). Laeuft NICHT mit pull_request_target und
# checkt den PR-Code an keiner Stelle aus -- der Trigger "workflow_run" reagiert nur auf den
# Abschluss des unprivilegierten Pruef-Workflows und bekommt dabei (anders als ein direkt durch
# Dependabot ausgeloester Workflow) ein normales, privilegiertes GITHUB_TOKEN. Der Fix-Commit
# wird ausschliesslich ueber die GitHub-Git-Data-API gebaut (Blob/Tree/Commit/Ref-Update via
# actions/github-script) -- es gibt in diesem Job keinen einzigen "actions/checkout"-Schritt und
# keine Shell-Interpolation von PR-Werten, der Arbeitsbaum des PR-Branches wird also nie
# ausgecheckt und PR-Code hier nie ausgefuehrt. Das behebt die CodeQL-Funde
# "actions/untrusted-checkout" (#13) und "actions/code-injection" (#14), die der vorherige
# pull_request_target-Ansatz ausgeloest hatte -- entspricht dem von CodeQL selbst empfohlenen
# Zwei-Workflow-Muster (siehe "Correct Usage" im Alert-Text).
on:
  workflow_run:
    workflows: ["Dependabot-Manifest pruefen"]
    types: [completed]

permissions:
  contents: write

jobs:
  apply-fix:
    # Security-Audit R-19: Drei Herkunftspruefungen, bevor der privilegierte Schritt ausgefuehrt wird:
    # 1. head_repository muss das eigene Repo sein (kein Fork-PR).
    # 2. Ausfuehrender Akteur muss dependabot[bot] sein.
    # 3. Branch-Name muss mit dependabot/ beginnen (verhindert, dass ein umbenannter Branch
    #    den privilegierten Commit auf einen beliebigen Branch schreibt).
    # Fehlt eine dieser Pruefungen, koennte ein Angreifer ueber eine oeffentlich beschriebene
    # Technik (Dependabot in einem Fork) PR-Code in den Hauptast einschleusen.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Artefakt herunterladen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: manifest-fix
          path: manifest-fix

      - name: Fix-Commit ueber die GitHub-API bauen und Branch aktualisieren
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const status = fs.readFileSync('manifest-fix/status', 'utf8').trim();
            if (status !== 'stale') {
              core.info('Manifest war bereits aktuell, nichts zu tun.');
              return;
            }

            // Security-Audit R-19: grober Format-Sanity-Check am Artefakt, bevor es committet
            // wird -- schuetzt nicht vor einem gezielt boesartigen, aber formal gueltigen
            // Artefakt (das waere nur durch vollstaendiges Neuberechnen aus dem Commit-Baum
            // ausschliessbar, siehe Audit-Empfehlung), faengt aber einen kaputten/unerwarteten
            // Artefakt-Inhalt ab, bevor er mit einem "verified"-API-Commit auf den Branch
            // geschrieben wird.
            const manifestText = fs.readFileSync('manifest-fix/install-manifest.sha256', 'utf8');
            const readmeText = fs.readFileSync('manifest-fix/README.md', 'utf8');
            const manifestLineRe = /^[0-9a-f]{64}  \S+$/;
            const manifestLines = manifestText.split('\n').filter(l => l.length > 0);
            if (manifestLines.length === 0 || !manifestLines.every(l => manifestLineRe.test(l))) {
              core.setFailed('install-manifest.sha256 im Artefakt hat nicht das erwartete Format -- Abbruch ohne Commit.');
              return;
            }
            if (!readmeText.includes('INSTALL_MANIFEST_SHA256=')) {
              core.setFailed('README.md im Artefakt enthaelt keinen INSTALL_MANIFEST_SHA256-Marker -- Abbruch ohne Commit.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const headBranch = context.payload.workflow_run.head_branch;

            const { data: baseCommit } = await github.rest.git.getCommit({
              owner, repo, commit_sha: headSha,
            });

            const readmeBlob = await github.rest.git.createBlob({
              owner, repo,
              content: fs.readFileSync('manifest-fix/README.md', 'utf8'),
              encoding: 'utf-8',
            });
            const manifestBlob = await github.rest.git.createBlob({
              owner, repo,
              content: fs.readFileSync('manifest-fix/install-manifest.sha256', 'utf8'),
              encoding: 'utf-8',
            });

            const { data: newTree } = await github.rest.git.createTree({
              owner, repo,
              base_tree: baseCommit.tree.sha,
              tree: [
                { path: 'README.md', mode: '100644', type: 'blob', sha: readmeBlob.data.sha },
                { path: 'install-manifest.sha256', mode: '100644', type: 'blob', sha: manifestBlob.data.sha },
              ],
            });

            const { data: newCommit } = await github.rest.git.createCommit({
              owner, repo,
              message: 'Install-Manifest nach Dependabot-Update automatisch neu erzeugen',
              tree: newTree.sha,
              parents: [headSha],
            });

            await github.rest.git.updateRef({
              owner, repo,
              ref: `heads/${headBranch}`,
              sha: newCommit.sha,
            });

            core.info(`Fix-Commit ${newCommit.sha} auf ${headBranch} gepusht.`);
