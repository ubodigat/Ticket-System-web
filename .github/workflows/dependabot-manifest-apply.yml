name: Dependabot-Manifest-Fix anwenden

# Teil 2 von 2 (Teil 1: dependabot-manifest.yml). Laeuft NICHT mit pull_request_target und
# checkt den PR-Code an keiner Stelle aus -- der Trigger "workflow_run" reagiert nur auf den
# Abschluss des unprivilegierten Pruef-Workflows und bekommt dabei (anders als ein direkt durch
# Dependabot ausgeloester Workflow) ein normales, privilegiertes GITHUB_TOKEN. Der Fix-Commit
# wird ausschliesslich ueber die GitHub-Git-Data-API gebaut (Blob/Tree/Commit/Ref-Update via
# actions/github-script) -- es gibt in diesem Job keinen einzigen "actions/checkout"-Schritt und
# keine Shell-Interpolation von PR-Werten, der Arbeitsbaum des PR-Branches wird also nie
# ausgecheckt und PR-Code hier nie ausgefuehrt. Das behebt die CodeQL-Funde
# "actions/untrusted-checkout" (#13) und "actions/code-injection" (#14), die der vorherige
# pull_request_target-Ansatz ausgeloest hatte -- entspricht dem von CodeQL selbst empfohlenen
# Zwei-Workflow-Muster (siehe "Correct Usage" im Alert-Text).
on:
  workflow_run:
    workflows: ["Dependabot-Manifest pruefen"]
    types: [completed]

permissions:
  contents: write

jobs:
  apply-fix:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Artefakt herunterladen
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: manifest-fix
          path: manifest-fix

      - name: Fix-Commit ueber die GitHub-API bauen und Branch aktualisieren
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = fs.readFileSync('manifest-fix/status', 'utf8').trim();
            if (status !== 'stale') {
              core.info('Manifest war bereits aktuell, nichts zu tun.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const headBranch = context.payload.workflow_run.head_branch;

            const { data: baseCommit } = await github.rest.git.getCommit({
              owner, repo, commit_sha: headSha,
            });

            const readmeBlob = await github.rest.git.createBlob({
              owner, repo,
              content: fs.readFileSync('manifest-fix/README.md', 'utf8'),
              encoding: 'utf-8',
            });
            const manifestBlob = await github.rest.git.createBlob({
              owner, repo,
              content: fs.readFileSync('manifest-fix/install-manifest.sha256', 'utf8'),
              encoding: 'utf-8',
            });

            const { data: newTree } = await github.rest.git.createTree({
              owner, repo,
              base_tree: baseCommit.tree.sha,
              tree: [
                { path: 'README.md', mode: '100644', type: 'blob', sha: readmeBlob.data.sha },
                { path: 'install-manifest.sha256', mode: '100644', type: 'blob', sha: manifestBlob.data.sha },
              ],
            });

            const { data: newCommit } = await github.rest.git.createCommit({
              owner, repo,
              message: 'Install-Manifest nach Dependabot-Update automatisch neu erzeugen',
              tree: newTree.sha,
              parents: [headSha],
            });

            await github.rest.git.updateRef({
              owner, repo,
              ref: `heads/${headBranch}`,
              sha: newCommit.sha,
            });

            core.info(`Fix-Commit ${newCommit.sha} auf ${headBranch} gepusht.`);
