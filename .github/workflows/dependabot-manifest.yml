name: Dependabot-Manifest pruefen

# Teil 1 von 2 der Loesung fuer das wiederkehrende "Install manifest is stale"-Problem bei
# Dependabot-PRs (Teil 2: dependabot-manifest-apply.yml). Dieser Workflow laeuft bewusst UN-
# privilegiert ueber den Standard-Trigger "pull_request": Workflows, die durch Dependabot
# ausgeloest werden, bekommen von GitHub ohnehin nur ein rein lesendes GITHUB_TOKEN, egal was
# hier unter "permissions" steht -- das ist exakt der sichere Kontext, um den PR-Branch
# auszuchecken und das Manifest-Skript darauf laufen zu lassen. Es wird hier NICHT committet
# oder gepusht (dafuer fehlen in diesem Kontext ohnehin die Rechte) -- das Ergebnis landet nur
# als Artefakt fuer Teil 2.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-manifest:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Manifest pruefen und bei Bedarf neu erzeugen
        run: |
          set -e
          mkdir -p /tmp/manifest-fix
          if node ops/create-install-manifest.mjs --check; then
            echo "clean" > /tmp/manifest-fix/status
          else
            node ops/create-install-manifest.mjs
            cp README.md install-manifest.sha256 /tmp/manifest-fix/
            echo "stale" > /tmp/manifest-fix/status
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manifest-fix
          path: /tmp/manifest-fix
          retention-days: 1
