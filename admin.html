<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support | Admin</title>
    <link rel="icon" type="image/png" href="picture/favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/otpauth/dist/otpauth.umd.min.js"></script>
</head>

<body data-guard="admin">
    <canvas id="stars"></canvas>

    <header class="topbar">
        <div class="topbar-left">
            <div class="brand-mini">Support Portal</div>
            <div class="crumb">Admin</div>
            <div id="user-display" class="topbar-user"></div>
        </div>
        <nav class="topbar-right">
            <button id="btn-to-dash" class="btn-ghost" onclick="window.location.href='dashboard.html'"><i data-lucide="layout-dashboard"></i>Dashboard</button>
            <button id="btn-global-logs" class="btn-ghost" style="display:none;"><i data-lucide="bell"></i>System-Logs</button>
            <button id="btn-archive" class="btn-ghost"><i data-lucide="archive"></i>Archiv</button>
            <button id="theme-toggle" class="btn-ghost btn-icon" title="Einstellungen" aria-label="Einstellungen"><i data-lucide="settings"></i></button>
            <button id="logout" class="btn-ghost"><i data-lucide="log-out"></i><span data-i18n="logout">Abmelden</span></button>
        </nav>
    </header>

    <main class="container">
        <!-- Archiv -->
        <div id="archive-view" class="archive-view">
            <div class="archive-header">
                <h3><i data-lucide="archive"></i>Archivierte Tickets</h3>
                <input type="text" id="archive-search" class="section-search" placeholder="Suche im Archiv (Titel, Autor, Inhalt)...">
                <button id="btn-back-kanban" class="btn-secondary"><i data-lucide="arrow-left"></i>Zurück zur Übersicht</button>
            </div>
            <div id="archive-list" class="archived-list"></div>
        </div>

        <div id="kanban-view">
            <!-- Kontoanfragen -->
            <section class="requests-board">
                <div class="panel-head">
                    <h3 class="panel-title">Konto-Anfragen</h3>
                </div>
                <div id="request-list" class="request-grid"></div>
            </section>

            <div class="kanban-board">
                <div class="column" id="col-new">
                    <div class="col-header">
                        <span><i data-lucide="inbox"></i>Neu</span>
                        <span class="count" id="count-new">0</span>
                    </div>
                    <div class="ticket-list" data-status="Neu" id="list-new"></div>
                </div>

                <div class="column" id="col-doing">
                    <div class="col-header">
                        <span><i data-lucide="loader"></i>In Bearbeitung</span>
                        <span class="count" id="count-doing">0</span>
                    </div>
                    <div class="ticket-list" data-status="In Bearbeitung" id="list-doing"></div>
                </div>

                <div class="column" id="col-done">
                    <div class="col-header">
                        <span><i data-lucide="check-circle"></i>Geschlossen</span>
                        <span class="count" id="count-done">0</span>
                    </div>
                    <div class="ticket-list" data-status="Geschlossen" id="list-done"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Ticket-Detail -->
    <div class="modal-overlay" id="ticket-modal">
        <div class="modal-container">
            <div id="m-history-sidebar" class="modal-sidebar"></div>
            <div class="modal modal-md">
                <div class="modal-header">
                    <h3 id="m-title">Ticket</h3>
                    <div class="modal-actions">
                        <button class="btn-ghost btn-icon" id="m-logs" title="Protokoll anzeigen" aria-label="Protokoll anzeigen"><i data-lucide="scroll-text"></i></button>
                        <button class="btn-ghost btn-icon" id="m-close" title="Schließen" aria-label="Schließen"><i data-lucide="x"></i></button>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="tabs">
                        <div class="tab-btn active" data-tab="details">Details</div>
                        <div class="tab-btn" data-tab="chat">Chat</div>
                    </div>

                    <div id="tab-details" class="tab-content active">
                        <div class="meta-grid ticket-meta-grid">
                            <div class="meta-item"><strong>Von</strong><span id="m-author" class="meta-value">-</span></div>
                            <div class="meta-item"><strong>Datum</strong><span id="m-date" class="meta-value">-</span></div>
                            <div class="meta-item">
                                <strong>Prio</strong>
                                <select id="m-prio-edit">
                                    <option value="Niedrig">Niedrig</option>
                                    <option value="Normal">Normal</option>
                                    <option value="Hoch">Hoch</option>
                                    <option value="Kritisch">Kritisch</option>
                                </select>
                            </div>
                            <div class="meta-item">
                                <strong>Kategorie</strong>
                                <div id="m-cat-container"></div>
                            </div>
                        </div>

                        <h4 class="section-title">Beschreibung</h4>
                        <p id="m-desc" class="desc-text"></p>

                        <div class="field">
                            <label>Zuweisung (Mehrfachauswahl möglich)</label>
                            <div class="multi-select-container" id="assignee-multi"></div>
                        </div>

                        <div class="comments-section">
                            <h4 class="section-title">Interne Notizen</h4>
                            <div id="m-comments" class="note-list"></div>
                            <div class="field">
                                <textarea id="m-new-comment" rows="2" placeholder="Kommentar hinzufügen..."></textarea>
                            </div>
                            <button class="btn-primary btn-block" id="btn-add-comment">Kommentieren</button>
                        </div>

                        <div class="actions-row">
                            <button id="btn-archive-ticket" class="btn-secondary" style="display:none;"><i data-lucide="archive"></i>Archivieren</button>
                        </div>
                    </div>

                    <div id="tab-chat" class="tab-content">
                        <div class="chat-container">
                            <div id="m-chat-msgs" class="chat-messages"></div>
                            <div class="chat-input-area">
                                <div class="toolbar">
                                    <button class="btn-ghost btn-icon btn-sm" title="Fett" aria-label="Fett" id="m-chat-bold"><i data-lucide="bold"></i></button>
                                    <button class="btn-ghost btn-icon btn-sm" title="Kursiv" aria-label="Kursiv" id="m-chat-italic"><i data-lucide="italic"></i></button>
                                    <label class="btn btn-ghost btn-icon btn-sm" title="Datei anhängen" aria-label="Datei anhängen">
                                        <i data-lucide="paperclip"></i>
                                        <input type="file" id="m-chat-file-input" multiple>
                                    </label>
                                </div>
                                <div id="m-chat-file-preview" class="file-preview"></div>
                                <div class="input-row">
                                    <textarea id="m-chat-input" placeholder="Nachricht schreiben... Strg+Enter zum Senden"></textarea>
                                    <button class="btn-primary btn-icon" id="btn-chat-send" title="Senden" aria-label="Senden"><i data-lucide="send"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" id="m-close-bt">Schließen</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Kontoanfrage annehmen -->
    <div class="modal-overlay" id="approve-modal">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3><i data-lucide="user-plus"></i>Benutzer erstellen</h3>
                <div class="modal-actions">
                    <button class="btn-ghost btn-icon" id="a-close" title="Schließen" aria-label="Schließen"><i data-lucide="x"></i></button>
                </div>
            </div>
            <div class="modal-body">
                <p>Erstelle einen Account für <strong id="a-name-disp"></strong>.</p>
                <div class="field">
                    <label for="a-username">Benutzername</label>
                    <input type="text" id="a-username" placeholder="z.B. maxm">
                </div>
                <div class="field">
                    <label for="a-password">Passwort</label>
                    <input type="text" id="a-password" value="123">
                </div>
                <div class="field">
                    <label for="a-role">Rolle</label>
                    <select id="a-role">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="field" id="a-dept-field" style="display:none;">
                    <label for="a-dept">Abteilung (nur für Admins)</label>
                    <select id="a-dept">
                        <option value="Allgemein">Allgemein</option>
                        <option value="Technik">Technik</option>
                        <option value="Account">Account</option>
                        <option value="Abrechnung">Abrechnung</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="a-cancel">Abbrechen</button>
                <button class="btn-primary" id="a-confirm">Erstellen</button>
            </div>
        </div>
    </div>

    <!-- Benutzerverwaltung -->
    <div class="modal-overlay" id="user-man-modal">
        <div class="modal modal-md">
            <div class="modal-header">
                <h3><i data-lucide="users"></i>Benutzerverwaltung</h3>
                <div class="modal-actions">
                    <button class="btn-ghost btn-icon" id="um-close" title="Schließen" aria-label="Schließen"><i data-lucide="x"></i></button>
                </div>
            </div>
            <div class="modal-body">
                <div id="um-list"></div>
            </div>
        </div>
    </div>

    <div id="toast"></div>
    <script src="script.js"></script>
</body>

</html>
