<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Support | Dashboard</title>
    <link rel="icon" type="image/png" href="picture/favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>

<body data-guard="user">
    <canvas id="stars"></canvas>

    <header class="topbar">
        <div class="topbar-left">
            <div class="brand-mini">Support Portal</div>
            <div class="crumb">Dashboard</div>
            <div id="user-display" class="topbar-user"></div>
        </div>
        <nav class="topbar-right">
            <button id="btn-notifications" class="btn-ghost btn-icon notification-button" title="Benachrichtigungen" aria-label="Benachrichtigungen"><i data-lucide="bell"></i><span class="notification-count" hidden>0</span></button>
            <button id="theme-toggle" class="btn-ghost btn-icon" title="Einstellungen" aria-label="Einstellungen"><i data-lucide="settings"></i></button>
            <button id="btn-logout" class="btn-ghost"><i data-lucide="log-out"></i><span data-i18n="logout">Abmelden</span></button>
        </nav>
    </header>

    <main class="container grid-2 dashboard-grid">
        <section class="card">
            <h2 data-i18n="newTicket">Neues Ticket</h2>
            <div class="field">
                <label for="t-title" data-i18n="subject">Betreff</label>
                <input id="t-title" type="text" placeholder="Kurzer Titel">
            </div>
            <div class="field">
                <label for="t-desc" data-i18n="description">Beschreibung</label>
                <textarea id="t-desc" rows="6" placeholder="Beschreibe dein Anliegen möglichst genau."></textarea>
            </div>
            <div class="field">
                <label>Anhänge</label>
                <label for="t-files" class="dropzone" id="t-files-dropzone">
                    <i data-lucide="upload-cloud"></i>
                    <span class="dropzone-text"><strong>Dateien hierher ziehen</strong> oder klicken zum Auswählen</span>
                    <input id="t-files" type="file" multiple>
                </label>
                <div id="t-files-preview" class="file-preview"></div>
            </div>
            <div class="form-grid">
                <div class="field">
                    <label for="t-prio" data-i18n="priority">Priorität</label>
                    <select id="t-prio">
                        <option value="Niedrig">Niedrig</option>
                        <option value="Normal">Normal</option>
                        <option value="Hoch">Hoch</option>
                    </select>
                </div>
                <div class="field">
                    <label data-i18n="category">Kategorie</label>
                    <div id="u-cat-container"></div>
                </div>
            </div>
            <div id="t-custom-fields" class="custom-fields-fill"></div>
            <button class="btn-primary btn-block" id="btn-create-ticket" data-i18n="submit">Absenden</button>
        </section>

        <section class="card ticket-list-card">
            <div class="section-head">
                <h2 data-i18n="myTickets">Deine Tickets</h2>
                <input type="text" id="u-search" class="section-search" placeholder="Suchen...">
            </div>
            <label class="filter-toggle">
                <input type="checkbox" id="dash-filter-archive">
                <span data-i18n="showClosedArchived">Geschlossene/archivierte einblenden</span>
            </label>
            <div class="table-head ticket-list-head">
                <div></div>
                <div data-i18n="subject">Betreff</div>
                <div data-i18n="status">Status</div>
                <div data-i18n="date">Datum</div>
                <div data-i18n="prio">Prio</div>
            </div>
            <div id="user-tickets"></div>
        </section>
    </main>

    <!-- Ticket-Ansicht für Benutzer -->
    <div class="modal-overlay" id="u-ticket-modal">
        <div class="modal modal-md">
            <div class="modal-header">
                <h3 id="u-m-title">Ticket</h3>
                <div class="modal-actions">
                    <button class="btn-ghost btn-icon" id="u-m-close" title="Schließen" aria-label="Schließen"><i data-lucide="x"></i></button>
                </div>
            </div>
            <div class="modal-body">
                <div class="tabs">
                    <div class="tab-btn active" data-tab="u-details" data-i18n="details">Details</div>
                    <div class="tab-btn" data-tab="u-chat" data-i18n="chat">Chat</div>
                </div>

                <div id="u-tab-details" class="tab-content active">
                    <div class="meta-grid">
                        <div class="meta-item"><strong>Status</strong><span id="u-m-status" class="meta-value">-</span></div>
                        <div class="meta-item"><strong>Datum</strong><span id="u-m-date" class="meta-value">-</span></div>
                        <div class="meta-item"><strong>Prio</strong><span id="u-m-prio" class="meta-value">-</span></div>
                        <div class="meta-item"><strong>Kategorie</strong><span id="u-m-cat" class="meta-value">-</span></div>
                        <div class="meta-item"><strong>Bearbeiter</strong><span id="u-m-assignee" class="meta-value">-</span></div>
                        <div class="meta-item"><strong>Archiviert</strong><span id="u-m-archived" class="meta-value">-</span></div>
                        <div class="meta-item" id="u-m-sla-item" hidden><strong>Bearbeitungszeit</strong><span id="u-m-sla-badge" class="sla-badge sla-badge-muted"></span></div>
                    </div>
                    <div id="u-waiting-request" class="waiting-request" hidden>
                        <strong>Wir benötigen noch folgende Angaben</strong>
                        <p id="u-waiting-message"></p>
                    </div>
                    <h4 class="section-title">Beschreibung</h4>
                    <p id="u-m-desc" class="desc-text"></p>
                    <div id="u-m-incident" class="incident-notice" hidden></div>
                    <div id="u-m-custom-fields-display" class="custom-fields-display" hidden></div>
                    <div id="u-m-ticket-attachments" class="ticket-attachments"></div>
                </div>

                <div id="u-tab-chat" class="tab-content">
                    <div class="chat-container">
                        <div id="u-chat-msgs" class="chat-messages"></div>
                        <div class="chat-input-area">
                            <div class="toolbar">
                                <button class="btn-ghost btn-icon btn-sm" title="Fett" aria-label="Fett" id="u-chat-bold"><i data-lucide="bold"></i></button>
                                <button class="btn-ghost btn-icon btn-sm" title="Kursiv" aria-label="Kursiv" id="u-chat-italic"><i data-lucide="italic"></i></button>
                                <button class="btn-ghost btn-icon btn-sm" title="Link einfügen" aria-label="Link einfügen" id="u-chat-link"><i data-lucide="link"></i></button>
                                <label class="btn btn-ghost btn-icon btn-sm" title="Datei anhängen" aria-label="Datei anhängen">
                                    <i data-lucide="paperclip"></i>
                                    <input type="file" id="u-chat-file" multiple>
                                </label>
                            </div>
                            <div id="u-chat-file-preview" class="file-preview"></div>
                            <div class="input-row">
                                <textarea id="u-chat-input" placeholder="Nachricht schreiben..."></textarea>
                                <button class="btn-primary btn-icon" id="u-chat-send" title="Senden" aria-label="Senden"><i data-lucide="send"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>
    <script src="script.js"></script>
</body>

</html>
